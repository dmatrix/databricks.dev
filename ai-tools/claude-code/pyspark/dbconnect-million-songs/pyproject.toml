[project]
name = "dbconnect-million-songs"
version = "0.1.0"
description = "Million Songs dataset example using Databricks Connect"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-connect>=15.0.0",
    "databricks-dlt >= 0.3.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
